  </g>
  <line class="grid" x1="24" x2="856" y1="386" y2="386"/>
  <text class="t" x="24" y="408">프로젝트 3 · 사내 업무 기획 (Bedrock)</text>
  <text class="s" x="856" y="408" text-anchor="end">10월 12일 12:03–12:56 · 0.9시간 · 레인 작업 3건</text>
  <text class="s" x="24" y="441">전부 Opus였다면</text>
  <text class="mb" x="212" y="441" text-anchor="end">$7.50</text>
  <text class="s" x="24" y="477">lanes로</text>
  <text class="mb" x="212" y="477" text-anchor="end">$5.16</text>
