<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="프로젝트 1 · 웹 게임: main이 일하는 동안 레인도 일했다. main이 일한 154분 옆에서 레인이 265분 일했어요 · 레인 작업 29건 (눈금이 작업이 들어온 때) · 시각은 KST">
  <style>
    .bg { fill: #f6f8fa; }
