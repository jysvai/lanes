  <text class="s" x="856" y="168" text-anchor="end">10월 11일 14:07–18:48 · 4.7시간 · 레인 작업 29건</text>
  <text class="s" x="24" y="201">전부 Opus였다면</text>
  <text class="mb" x="212" y="201" text-anchor="end">$106.13</text>
  <text class="s" x="24" y="237">lanes로</text>
  <text class="mb" x="212" y="237" text-anchor="end">$70.64</text>
