<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 416" width="880" height="416" role="img" aria-label="What the lanes saved on two projects: Project 1 · a web game $106.13 → $70.64; Project 2 · the lanes plugin $39.51 → $30.89; $44.11 saved in all · 30%">
  <style>
