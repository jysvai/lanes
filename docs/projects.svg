  <text class="s" x="24" y="321">전부 Opus였다면</text>
  <text class="mb" x="212" y="321" text-anchor="end">$39.51</text>
  <text class="s" x="24" y="357">lanes로</text>
  <text class="mb" x="212" y="357" text-anchor="end">$30.89</text>
