  <rect class="bg" width="880" height="536" rx="14"/>
  <text class="h" x="24" y="38">세 프로젝트에서 레인이 아낀 비용</text>
  <text class="s" x="24" y="60">실측 · 세션 기록의 요청마다 모델별 Claude API 정가로 계산 · 회색은 레인 몫을 Opus가 했을 때</text>
  <text class="hero" x="24" y="104">총 $46.45 절약 · 30%</text>
