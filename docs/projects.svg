      .opus { fill: #6e7681; opacity: .6; } .grid { stroke: #30363d; } .save { stroke: #e6edf3; }
      .ok { stroke: #3fb950; } .hl { stroke: #6e7681; } .tick { stroke: #9198a1; } .tid { fill: #9198a1; }
    }
  </style>
  <defs>
    <clipPath id="grow1"><rect x="0" y="178" width="880" height="70"><animate attributeName="width" from="200" to="880" dur="1.1s" fill="freeze"/></rect></clipPath>
    <clipPath id="grow2"><rect x="0" y="298" width="880" height="70"><animate attributeName="width" values="200;200;880" keyTimes="0;0.31;1" dur="1.6s" fill="freeze"/></rect></clipPath>
