<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 326" width="880" height="326" role="img" aria-label="The same task on three models: cost, time, right answer: List and count Opus $0.24 3/3, Sonnet $0.066 3/3, Haiku $0.007 3/3; Run the tests, report Opus $0.14 3/3, Sonnet $0.067 3/3, Haiku $0.004 1/3; Review for a bug Opus $0.15 3/3, Sonnet $0.067 3/3, Haiku $0.004 3/3">
  <style>
