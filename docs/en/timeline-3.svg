<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" width="880" height="280" role="img" aria-label="Project 3 · a work planning doc (Bedrock): the lanes worked while main did. Beside 14 minutes of main's work, the lanes worked 15 minutes · 3 lane tasks (a tick where each came in) · times in KST">
  <style>
    .bg { fill: #f6f8fa; }
    .card { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.2; }
    .h { font: 700 19px -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #1f2328; }
    .hero { font: 700 26px -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #1f2328; }
    .t { font: 600 15px -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #1f2328; }
    .s { font: 13px -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #57606a; }
    .m { font: 13px ui-monospace, "Cascadia Mono", Menlo, Consolas, "Apple SD Gothic Neo", "Malgun Gothic", monospace; fill: #1f2328; }
    .mb { font: 700 13px ui-monospace, "Cascadia Mono", Menlo, Consolas, "Apple SD Gothic Neo", "Malgun Gothic", monospace; fill: #1f2328; }
    .w { font: 600 12.5px -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #ffffff; }
    .main { fill: #0a7ea4; } .mid { fill: #8250df; } .low { fill: #1a7f37; }
    .opus { fill: #8c959f; opacity: .55; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .save { fill: none; stroke: #1f2328; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .ok { fill: none; stroke: #1a7f37; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .idle { fill: url(#hatch); }
    .hl { stroke: #8c959f; stroke-width: 1; }
    .tick { stroke: #57606a; stroke-width: 1.5; }
    .tid { font: 11px ui-monospace, "Cascadia Mono", Menlo, Consolas, "Apple SD Gothic Neo", "Malgun Gothic", monospace; fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; } .card { fill: #161b22; stroke: #30363d; }
      .h, .hero, .t, .m, .mb { fill: #e6edf3; } .s { fill: #9198a1; }
      .main { fill: #1b8fb8; } .mid { fill: #a371f7; } .low { fill: #2ea043; }
      .opus { fill: #6e7681; opacity: .6; } .grid { stroke: #30363d; } .save { stroke: #e6edf3; }
      .ok { stroke: #3fb950; } .hl { stroke: #6e7681; } .tick { stroke: #9198a1; } .tid { fill: #9198a1; }
    }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" class="hl"/></pattern>
    <clipPath id="sweep"><rect x="0" y="0" width="880" height="300"><animate attributeName="width" from="120" to="880" dur="2.4s" fill="freeze"/></rect></clipPath>
  </defs>
  <rect class="bg" width="880" height="280" rx="14"/>
  <text class="h" x="24" y="38">Project 3 · a work planning doc (Bedrock): the lanes worked while main did</text>
  <text class="s" x="24" y="60">Beside 14 minutes of main's work, the lanes worked 15 minutes · 3 lane tasks (a tick where each came in) · times in KST</text>
  <line class="grid" x1="488.4" x2="488.4" y1="84" y2="244"/>
  <text class="s" x="488.4" y="262" text-anchor="middle">12:30</text>
  <text class="s" x="24" y="109">main · Opus</text>
  <text class="s" x="24" y="165">mid · Sonnet</text>
  <text class="s" x="24" y="221">low · Haiku</text>
  <g clip-path="url(#sweep)">
    <rect class="main" x="199.7" y="92" width="63.8" height="24" rx="4"/>
    <rect class="main" x="547.2" y="92" width="123.5" height="24" rx="4"/>
    <rect class="main" x="799.4" y="92" width="3.0" height="24" rx="4"/>
    <rect class="main" x="854.4" y="92" width="3.0" height="24" rx="4"/>
    <rect class="mid" x="549.5" y="148" width="37.6" height="24" rx="4"/>
    <rect class="mid" x="666.0" y="148" width="134.3" height="24" rx="4"/>
    <rect class="low" x="549.1" y="204" width="35.1" height="24" rx="4"/>
    <line class="tick" x1="547.0" x2="547.0" y1="198" y2="204"/>
    <text class="tid" x="547.0" y="195" text-anchor="middle">T1</text>
    <line class="tick" x1="548.4" x2="548.4" y1="142" y2="148"/>
    <text class="tid" x="548.4" y="139" text-anchor="middle">T2</text>
    <line class="tick" x1="665.6" x2="665.6" y1="142" y2="148"/>
    <text class="tid" x="665.6" y="139" text-anchor="middle">T3</text>
  </g>
</svg>
