    .t { font: 600 15px -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #1f2328; }
    .s { font: 13px -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #57606a; }
    .m { font: 13px ui-monospace, "Cascadia Mono", Menlo, Consolas, "Apple SD Gothic Neo", "Malgun Gothic", monospace; fill: #1f2328; }
    .mb { font: 700 13px ui-monospace, "Cascadia Mono", Menlo, Consolas, "Apple SD Gothic Neo", "Malgun Gothic", monospace; fill: #1f2328; }
    .w { font: 600 12.5px -apple-system, "Segoe UI", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #ffffff; }
    .main { fill: #0a7ea4; } .mid { fill: #8250df; } .low { fill: #1a7f37; }
    .opus { fill: #8c959f; opacity: .55; }
    .grid { stroke: #d0d7de; stroke-width: 1; }
    .save { fill: none; stroke: #1f2328; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .ok { fill: none; stroke: #1a7f37; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .idle { fill: url(#hatch); }
    .hl { stroke: #8c959f; stroke-width: 1; }
    .tick { stroke: #57606a; stroke-width: 1.5; }
    .tid { font: 11px ui-monospace, "Cascadia Mono", Menlo, Consolas, "Apple SD Gothic Neo", "Malgun Gothic", monospace; fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; } .card { fill: #161b22; stroke: #30363d; }
      .h, .hero, .t, .m, .mb { fill: #e6edf3; } .s { fill: #9198a1; }
      .main { fill: #1b8fb8; } .mid { fill: #a371f7; } .low { fill: #2ea043; }
      .opus { fill: #6e7681; opacity: .6; } .grid { stroke: #30363d; } .save { stroke: #e6edf3; }
      .ok { stroke: #3fb950; } .hl { stroke: #6e7681; } .tick { stroke: #9198a1; } .tid { fill: #9198a1; }
    }
  </style>
